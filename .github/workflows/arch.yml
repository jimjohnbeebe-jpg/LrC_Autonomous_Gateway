# Architecture boundary gate (issue #148): the CLAUDE.md "Module Map" rules for engine\src.
name: arch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  arch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      # No install scripts: the gate needs no native build (swc loads its prebuilt platform package).
      - run: npm ci --ignore-scripts
      - run: npm run arch:check
