[package]
name = "lrc-avg-s9-hud"
version = "0.0.0"
description = "Spike S9: the Tauri HUD shell validation (Phase 7 row 1). Throwaway."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# Every crate pinned exactly (rule 01). tauri: 2.12.x (spec D2); it asks for windows ^0.62 (crates.io index).
tauri = { version = "=2.12.1", features = [] }
serde_json = "=1.0.151"
# The version tauri 2.12.1 resolves (Cargo.lock), for WebView2 IsVisible and the memory target (webview.rs).
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Size settings from https://raw.githubusercontent.com/tauri-apps/tauri-docs/v2/src/content/docs/concept/size.mdx
# lines 27-31, so S9-12 measures a release build as Tauri recommends it.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
